<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Start video capture at highest supported resolution</title>
    </head>
    <body>
        <video id="video" autoplay playsinline> </video>
        <audio src="outfoxing.mp3" controls></audio>

        <input id="playButton" type="button" value="Play" />
        <input id="stopButton" type="button" value="Stop" />

        <script type="text/javascript">
            const playButton = document.getElementById("playButton");
            const stopButton = document.getElementById("stopButton");
            const audioElement = document.querySelector("audio");
            let audioCtx;
            let track;

            playButton.addEventListener(
                "click",
                () => {
                    if (!audioCtx) initAudio();
                    audioElement.play();
                },
                false
            );

            stopButton.addEventListener(
                "click",
                () => {
                    audioElement.pause();
                },
                false
            );

            function initAudio()
            {
                audioCtx = new AudioContext();
                track = new MediaElementAudioSourceNode(
                    audioCtx,
                    { mediaElement: audioElement, }
                );

                track.connect(audioCtx.destination);
            }
        </script>

        <script type="text/javascript" nomodule>
            async function openBestResolution()
            {
                const resolutions = [
                    { width: 3840, height: 2160 }, // 4K
                    { width: 1920, height: 1080 }, // 1080p
                    { width: 1280, height: 720 },  // 720p
                    { width: 640, height: 480 }    // VGA
                ];

                for (let res of resolutions)
                {
                    try {
                        console.log(`Trying resolution ${res.width}x${res.height}...`);

                        stream = await navigator.mediaDevices.getUserMedia({
                            video: { width: { exact: res.width }, height: { exact: res.height } }
                        });
                        console.log(`Supported :-)`);
                        video.srcObject = stream;

                        console.log(`Max width: ${stream.getVideoTracks()[0].getCapabilities().width.max}`);
                        console.log(`Max height: ${stream.getVideoTracks()[0].getCapabilities().height.max}`);

                        break;
                    } catch (e) {
                        console.log(`Not supported :-(`);
                    }
                }
            }

            let midi = null; // global MIDIAccess object

            function onMIDISuccess(midiAccess)
            {
                console.log("MIDI ready!");
                midi = midiAccess; // store in the global (in real usage, would probably keep in an object instance)
                listInputsAndOutputs(midi);
                startLoggingMIDIInput(midi);
            }

            function onMIDIFailure(msg)
            {
                console.error(`Failed to get MIDI access - ${msg}`);
            }

            function listInputsAndOutputs(midiAccess)
            {
                console.log("MIDI inputs:");
                for (const entry of midiAccess.inputs)
                {
                    const input = entry[1];
                    console.log(
                        `Input port [type:'${input.type}']` +
                        ` id:'${input.id}'` +
                        ` manufacturer:'${input.manufacturer}'` +
                        ` name:'${input.name}'` +
                        ` version:'${input.version}'`,
                    );
                }

                console.log("MIDI outputs:");
                for (const entry of midiAccess.outputs)
                {
                    const output = entry[1];
                    console.log(
                        `Output port [type:'${output.type}'] id:'${output.id}' manufacturer:'${output.manufacturer}' name:'${output.name}' version:'${output.version}'`,
                    );
                }
            }

            function onMIDIMessage(event)
            {
                let str = `MIDI message received at timestamp ${event.timeStamp}[${event.data.length} bytes]: `;
                for (const character of event.data)
                {
                    str += `0x${character.toString(16)} `;
                }
                console.log(str);
            }

            function startLoggingMIDIInput(midiAccess)
            {
                midiAccess.inputs.forEach((entry) => {
                    entry.onmidimessage = onMIDIMessage;
                });
            }

            navigator.requestMIDIAccess({ sysex: false }).then(onMIDISuccess, onMIDIFailure);

            openBestResolution();

        </script>
    </body>
</html>
