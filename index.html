<!DOCTYPE html>
<html lang="en">

<head>
    <title>Hand-Drawn Synthesizer - Dublin Maker 2026</title>
    <meta charset="utf-8">
    <style>
        #vid {display:none; border: 5px solid red;}
        #vidCanvas {
            display: inline-block;
            vertical-align: top;
            margin: 0; padding: 0;
            border: 5px solid blue;
        }
        #statusDiv {display: inline-block; border: 2px dotted black;}
        #waveCanvas {border: 5px solid magenta;}
    </style>
</head>

<body>
    <video id="vid" autoplay playsinline> </video>
    <canvas id="vidCanvas" width="800" height="600"></canvas>
    <div id="controls">
        <label for="attack">Attack</label>
        <input name="attack" id="attackRange" type="range" min="0" max="0.25" value="0" step="0.01" />

        <label for="release">Release</label>
        <input name="release" id="releaseRange" type="range" min="0" max="2.0" value="0" step="0.1" />
        <div id="statusDiv">Hello!</div>
        <div>
            <input type="radio" name="captureMethod" value="max" id="CMmaxRadio">
            <label for="CMmaxRadio">max px val in each column</label>
            <input type="radio" name="captureMethod" value="argmin" id="CMargminRadio">
            <label for="CMargminRadio">y coord of min in each column</label>
        </div>

    </div>
    <canvas id="waveCanvas" width="800" height="200"></canvas>

    <script type="text/javascript">
        let audioCtx;
        let buffer;
        let N;
        let sources = Array(128).fill(null);
        let envelopes = Array(128).fill(null);
        let noteTimes = Array(128).fill(null);
        let noteVelocities = Array(128).fill(null);
        let midi = null;

        let attackTime = 0.10;
        let releaseTime = 0.5;

        const vid = document.querySelector("#vid");
        const vidCanvas = document.querySelector("#vidCanvas")
        const statusDiv = document.querySelector("#statusDiv");
        const waveCanvas = document.querySelector("#waveCanvas");
        const attackRange = document.querySelector("#attackRange");
        const releaseRange = document.querySelector("#releaseRange");
        const CMmaxRadio = document.querySelector("#CMmaxRadio");
        const CMargminRadio = document.querySelector("#CMargminRadio");

        attackRange.value = attackTime;
        releaseRange.value = releaseTime;
        CMmaxRadio.checked = true;

        attackRange.addEventListener("input", (ev) => {
            attackTime = parseFloat(ev.target.value);
        });
        releaseRange.addEventListener("input", (ev) => {
            releaseTime = parseFloat(ev.target.value);
        });

        let vidctx, wavectx;
        let w_vid=800, h_vid=600;
        let w_wave=800, h_wave=256;
        N = w_vid;

        // Update wave canvas width and height
        waveCanvas.width = w_wave;
        waveCanvas.height = h_wave;

        navigator.requestMIDIAccess({ sysex: false }).then(onMIDISuccess, onMIDIFailure);

        openBestResolution();

        window.onload = function()
        {
            window.onresize();
            window.setInterval(draw, 100);
        }

        window.onresize = function()
        {
            // Note: I added the willReadFrequently as suggested by a warning
            // from Chromium saying that multiple readback operations are
            // faster when it's set.
            vidctx = vidCanvas.getContext("2d", { willReadFrequently: true });
            wavectx = waveCanvas.getContext("2d");
        }

        function draw()
        {
            vidctx.drawImage(vid, 0, 0);

            let idata = vidctx.getImageData(0, 0, w_vid, h_vid); // get frame data
            let p = idata.data;                                  // extract pixel data
            let x, y, m;

            // Create an array to store captured wave
            wave = Array(w_vid).fill(0);

            // Fill wave array with max values from pixel columns
            // Samples should end up betwen 0 and 2 before 
            if (CMmaxRadio.checked)
            {
                for (x=0 ; x<w_vid; x++)
                {
                    for (y=0 ; y<h_vid; y++)
                    {
                        m = 4 * (y*w_vid + x);
                        val = p[m] + p[m+1] + p[m+2];
                        if (val > wave[x]) wave[x] = val;
                    }
                    //wave[x] /= 512.0; // almost right but still some clipping
                    wave[x] /= 1024.0;
                }
            }

            // Alternative wave capture using argmin
            else if (CMargminRadio.checked)
            {
                for (x=0 ; x<w_vid; x++)
                {
                    let min = 1024.0;
                    for (y=0 ; y<h_vid; y++)
                    {
                        m = 4 * (y*w_vid + x);
                        val = p[m] + p[m+1] + p[m+2];
                        if (val < min)
                        {
                            min = val;
                            wave[x] = (h_vid-y)*2.0/h_vid;
                        }
                    }
                }
            }

            // Subtract mean from the captured wave
            let mean = 0;
            for (x=0 ; x<N ; ++x) mean += wave[x];
            mean /= N;
            for (x=0 ; x<N ; ++x) wave[x] -= mean;

            wavectx.clearRect(0, 0, w_wave, h_wave);
            wavectx.beginPath();
            wavectx.strokeStyle = "#3F3F3F";
            wavectx.lineWidth = 1.0;
            wavectx.moveTo(0, h_wave * (0.5 - wave[0]));
            for (x=1 ; x<w_wave ; ++x) wavectx.lineTo(x, h_wave * (0.5 + 0.5*wave[x]));
            wavectx.stroke();

            if (audioCtx)
            {
                const buf = buffer.getChannelData(0);
                for (let i=0 ; i<N ; i++) buf[i] = wave[i];
            }
            else initAudio();

            statusDiv.textContent = `attack:${attackTime}s, release:${releaseTime}s`;
        }

        function onMIDIMessage(event)
        {
            if (event.data[0] == 0x90)
            {
                noteOn(event.data[1], event.data[2]);
            }
            else if (event.data[0] == 0x80)
            {
                noteOff(event.data[1], event.data[2]);
            }
            else
            {
                let str = `MIDI message received at timestamp ` +
                    `${event.timeStamp}[${event.data.length} bytes]: `;
                for (const character of event.data)
                {
                    str += `0x${character.toString(16)} `;
                }
                console.log(str);
            }
        }

        function noteOn(noteNumber, noteVelocity)
        {
            if (!audioCtx) initAudio();

            console.log(`Note on: noteNumber=${noteNumber}, noteVelocity=${noteVelocity}`);

            //const semitone = 1.059463094359295;
            let f = 440.0 * 2.0**((noteNumber-69.0)/12.0);

            // If an existing source is playing this note then
            // stop it and null that element in sources array
            if (sources[noteNumber])
            {
                sources[noteNumber].stop();
                sources[noteNumber] = null;
            }

            // Get current time
            let now = audioCtx.currentTime;

            // Create a new source to play this note
            let source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            //source.playbackRate.value = f * 1024 / audioCtx.sampleRate;
            source.playbackRate.value = f * N / audioCtx.sampleRate;
            let envelope = new GainNode(audioCtx);
            envelope.gain.setValueAtTime(0, now);
            envelope.gain.linearRampToValueAtTime(noteVelocity/128.0, now + attackTime)
            source.connect(envelope).connect(audioCtx.destination);
            source.start();

            // Remember the new source so that we can stop it later
            sources[noteNumber] = source;
            envelopes[noteNumber] = envelope;
            noteTimes[noteNumber] = now;
            noteVelocities[noteNumber] = noteVelocity;
        }

        function noteOff(noteNumber, noteVelocity)
        {
            console.log(`Note off: noteNumber=${noteNumber}, noteVelocity=${noteVelocity}`);
            // Either start release now or at end of attack, whichever comes later
            let t = audioCtx.currentTime;
            if (noteTimes[noteNumber] + attackTime > t)
            {
                t = noteTimes[noteNumber] + attackTime ;
            }
            let envelope = envelopes[noteNumber];
            envelope.gain.setValueAtTime(noteVelocities[noteNumber]/128.0, t);
            envelope.gain.linearRampToValueAtTime(0, t + releaseTime);
            sources[noteNumber].stop(t + releaseTime);
            sources[noteNumber] = null;
            envelopes[noteNumber] = null;
            noteTimes[noteNumber] = null;
            noteVelocities[noteNumber] = null;
        }

        function initAudio()
        {
            console.log("initAudio");
            audioCtx = new AudioContext();
            //N = 1024;
            buffer = audioCtx.createBuffer(1, N, audioCtx.sampleRate);

            // Fill audio buffer with test signal
            // Sample values should be between -1.0 and +1.0
            //const buf = buffer.getChannelData(0);
            //for (let i=0 ; i<N ; i++) {
            //    buf[i] = Math.sin(i * 2.0 * Math.PI / N);
            //}
            //console.log("N: ", N);
        }

        async function openBestResolution()
        {
            const resolutions = [
                //{ width: 3840, height: 2160 }, // 4K
                //{ width: 1920, height: 1080 }, // 1080p
                //{ width: 1280, height: 720 },  // 720p
                { width: 800, height: 600 },   // ??
                { width: 640, height: 480 }    // VGA
            ];

            for (let res of resolutions)
            {
                try {
                    console.log(`Trying resolution ${res.width}x${res.height}...`);

                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { exact: res.width }, height: { exact: res.height } }
                    });
                    console.log(`Supported :-)`);
                    vid.srcObject = stream;

                    console.log(`Max width: ${stream.getVideoTracks()[0].getCapabilities().width.max}`);
                    console.log(`Max height: ${stream.getVideoTracks()[0].getCapabilities().height.max}`);

                    break;
                } catch (e) {
                    console.log(`Not supported :-(`);
                }
            }
        }

        function onMIDISuccess(midiAccess)
        {
            console.log("MIDI ready!");
            // store in the global (in real usage, would probably keep in an object instance)
            midi = midiAccess; 
            listMIDIInputsAndOutputs(midi);

            // Start processing incoming MIDI data
            midi.inputs.forEach((entry) => {
                entry.onmidimessage = onMIDIMessage;
            });
        }

        function onMIDIFailure(msg)
        {
            console.error(`Failed to get MIDI access - ${msg}`);
        }

        function listMIDIInputsAndOutputs(midiAccess)
        {
            console.log("MIDI inputs:");
            for (const entry of midiAccess.inputs)
            {
                const input = entry[1];
                console.log(
                    `Input port [type:'${input.type}']` +
                    ` id:'${input.id}'` +
                    ` manufacturer:'${input.manufacturer}'` +
                    ` name:'${input.name}'` +
                    ` version:'${input.version}'`,
                );
            }

            console.log("MIDI outputs:");
            for (const entry of midiAccess.outputs)
            {
                const output = entry[1];
                console.log(
                    `Output port [type:'${output.type}']` +
                    ` id:'${output.id}'` +
                    ` manufacturer:'${output.manufacturer}'` +
                    ` name:'${output.name}'` +
                    ` version:'${output.version}'`,
                );
            }
        }

    </script>
</body>
</html>
