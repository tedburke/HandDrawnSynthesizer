<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Hand-Drawn Synthesizer - Dublin Maker 2026</title>
    </head>
    <body>
        <video id="video" autoplay playsinline> </video>
        <input id="stopButton" type="button" value="Stop" />

        <script type="text/javascript">
            let audioCtx;
            let buffer;
            let N;
            let sources = Array(128).fill(null);
            let midi = null; // global MIDIAccess object

            const video = document.getElementById("video");
            const stopButton = document.getElementById("stopButton");

            // Not doing anything with button currently,
            // but leaving this here for future reference
            //stopButton.addEventListener("click", stop, false);

            navigator.requestMIDIAccess({ sysex: false }).then(onMIDISuccess, onMIDIFailure);

            openBestResolution();

            function onMIDIMessage(event)
            {
                if (event.data[0] == 0x90)
                {
                    noteOn(event.data[1], event.data[2]);
                }
                else if (event.data[0] == 0x80)
                {
                    noteOff(event.data[1], event.data[2]);
                }
                else
                {
                    let str = `MIDI message received at timestamp ` +
                        `${event.timeStamp}[${event.data.length} bytes]: `;
                    for (const character of event.data)
                    {
                        str += `0x${character.toString(16)} `;
                    }
                    console.log(str);
                }
            }

            function noteOn(noteNumber, noteVelocity)
            {
                if (!audioCtx) initAudio();

                console.log(`Note on: noteNumber=${noteNumber}, noteVelocity=${noteVelocity}`);
                
                const semitone = 1.059463094359295;
                let f = 440.0 * 2.0**((noteNumber-69.0)/12.0);

                // If an existing source is playing this note then
                // stop it and null that element in sources array
                if (sources[noteNumber])
                {
                    sources[noteNumber].stop();
                    sources[noteNumber] = null;
                }

                // Create a new source to play this note
                let source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.loop = true;
                source.playbackRate.value = f * 1024 / audioCtx.sampleRate;
                source.start();

                // Remember the new source so that we can stop it later
                sources[noteNumber] = source;

                //source.onended = () => {
                //    console.log("note finished");
                //}
            }

            function noteOff(noteNumber, noteVelocity)
            {
                console.log(`Note off: noteNumber=${noteNumber}, noteVelocity=${noteVelocity}`);
                sources[noteNumber].stop();
                sources[noteNumber] = null;
            }

            function initAudio()
            {
                console.log("initAudio");
                audioCtx = new AudioContext();
                N = 1024;
                buffer = audioCtx.createBuffer(1, N, audioCtx.sampleRate);

                // Fill audio buffer with test signal
                // Sample values should be between -1.0 and +1.0
                const buf = buffer.getChannelData(0);
                for (let i=0 ; i<N ; i++) {
                    buf[i] = Math.sin(i * 2.0 * Math.PI / N);
                }
                console.log("N: ", N);
            }

            async function openBestResolution()
            {
                const resolutions = [
                    { width: 3840, height: 2160 }, // 4K
                    { width: 1920, height: 1080 }, // 1080p
                    { width: 1280, height: 720 },  // 720p
                    { width: 640, height: 480 }    // VGA
                ];

                for (let res of resolutions)
                {
                    try {
                        console.log(`Trying resolution ${res.width}x${res.height}...`);

                        stream = await navigator.mediaDevices.getUserMedia({
                            video: { width: { exact: res.width }, height: { exact: res.height } }
                        });
                        console.log(`Supported :-)`);
                        video.srcObject = stream;

                        console.log(`Max width: ${stream.getVideoTracks()[0].getCapabilities().width.max}`);
                        console.log(`Max height: ${stream.getVideoTracks()[0].getCapabilities().height.max}`);

                        break;
                    } catch (e) {
                        console.log(`Not supported :-(`);
                    }
                }
            }

            function onMIDISuccess(midiAccess)
            {
                console.log("MIDI ready!");
                // store in the global (in real usage, would probably keep in an object instance)
                midi = midiAccess; 
                listMIDIInputsAndOutputs(midi);

                // Start processing incoming MIDI data
                midi.inputs.forEach((entry) => {
                    entry.onmidimessage = onMIDIMessage;
                });
            }

            function onMIDIFailure(msg)
            {
                console.error(`Failed to get MIDI access - ${msg}`);
            }

            function listMIDIInputsAndOutputs(midiAccess)
            {
                console.log("MIDI inputs:");
                for (const entry of midiAccess.inputs)
                {
                    const input = entry[1];
                    console.log(
                        `Input port [type:'${input.type}']` +
                        ` id:'${input.id}'` +
                        ` manufacturer:'${input.manufacturer}'` +
                        ` name:'${input.name}'` +
                        ` version:'${input.version}'`,
                    );
                }

                console.log("MIDI outputs:");
                for (const entry of midiAccess.outputs)
                {
                    const output = entry[1];
                    console.log(
                        `Output port [type:'${output.type}']` +
                        ` id:'${output.id}'` +
                        ` manufacturer:'${output.manufacturer}'` +
                        ` name:'${output.name}'` +
                        ` version:'${output.version}'`,
                    );
                }
            }

        </script>
    </body>
</html>
